<div class="details">
  <div id="breadcrumbs">
    <a href="{{ layout.breadcrumb_link }}" class="breadcrumb-link type-text size-tiny weight-medium">
      {% include icons/move-left.html %}
      {{ layout.breadcrumb }}
    </a>
    {% if page.layout == "post" %}
    <p class="post-date type-text size-tiny weight-medium">{{ page.date | date: '%m.%d.%Y' }}</p>
    {% endif %}
  </div>
  <h1 class="type-text size-jumbo weight-semibold">{{ page.title }}</h1>
  {% if page.layout == "case-study" %}
  <p class="type-text size-large">{{ page.description }}</p>
  {% endif %}
</div>
{% if page.image %}
<img id="featured-image" src="{{ page.image }}" alt="Alt text">
{% endif %}
